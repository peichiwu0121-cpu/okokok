<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>理財目標規劃工具</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a24;--mut:#5f6f67;--ac:#1f7a5a;--ac2:#e8f3ee;--bd:#dde3de;--bad:#c0392b;--good:#1f7a5a;--line:#2d6cdf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--tx:#e8efea;--mut:#9bb0a5;--ac:#4fc795;--ac2:#22332b;--bd:#304038;--bad:#ff7b6b;--good:#4fc795;--line:#6aa0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--tx:#e8efea;--mut:#9bb0a5;--ac:#4fc795;--ac2:#22332b;--bd:#304038;--bad:#ff7b6b;--good:#4fc795;--line:#6aa0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:.2em 0}.sub{color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:320px 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.presets button{padding:5px 10px;border-radius:99px;border:1px solid var(--bd);background:var(--ac2);color:var(--tx);cursor:pointer;font:inherit;font-size:.82rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--ac2);border-radius:10px;padding:10px 12px}.k small{color:var(--mut);display:block;font-size:.78rem}.k b{font-size:1.2rem}
.status{padding:12px 14px;border-radius:10px;margin-bottom:12px;font-weight:600}
.ok{background:var(--ac2);color:var(--good)}.no{background:rgba(192,57,43,.12);color:var(--bad)}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}h3{margin:14px 0 6px;font-size:1rem}
.note{font-size:.8rem;color:var(--mut);margin-top:10px}
svg{width:100%;height:auto;display:block}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>理財目標規劃工具</h1>
<p class="sub">以 PV（現值）、FV（終值）、PMT（定期投入）設定目標，分析你離目標還差多少。</p>
<div class="tabs"><button id="t1" class="on">目標分析</button><button id="t2">PV / FV / PMT 計算機</button></div>

<div id="p1" class="grid">
 <div class="card">
  <div class="presets"><button data-p="retire">退休金</button><button data-p="house">買房頭期款</button><button data-p="edu">子女教育</button><button data-p="car">換車</button></div>
  <label>目標金額（元，今日購買力）</label><input id="g_t" type="number" value="10000000">
  <label>達成年限（年）</label><input id="g_y" type="number" value="20">
  <label>目前已有資產 PV（元）</label><input id="g_pv" type="number" value="500000">
  <label>每月投入 PMT（元）</label><input id="g_pmt" type="number" value="20000">
  <label>預期年報酬率（%）</label><input id="g_r" type="number" step="0.1" value="5">
  <label>預期通膨率（%）</label><input id="g_i" type="number" step="0.1" value="2">
 </div>
 <div class="card" id="out1"></div>
</div>

<div id="p2" class="grid hide">
 <div class="card">
  <label>要求解的項目</label>
  <select id="c_s"><option value="FV">FV 終值（未來能累積多少）</option><option value="PMT">PMT 每月投入（需要存多少）</option><option value="PV">PV 現值（現在需要多少）</option></select>
  <div id="c_pv_w"><label>PV 現值（元）</label><input id="c_pv" type="number" value="100000"></div>
  <div id="c_pmt_w"><label>PMT 每月投入（元）</label><input id="c_pmt" type="number" value="10000"></div>
  <div id="c_fv_w"><label>FV 終值（元）</label><input id="c_fv" type="number" value="5000000"></div>
  <label>年報酬率（%）</label><input id="c_r" type="number" step="0.1" value="5">
  <label>期間（年）</label><input id="c_y" type="number" value="15">
 </div>
 <div class="card" id="out2"></div>
</div>

<p class="note">計算假設：月複利、每月月底投入。報酬率為假設值，不代表實際投資結果，僅供規劃參考。</p>
</div>

<script>
const $=id=>document.getElementById(id),v=id=>parseFloat($(id).value)||0;
const fmt=x=>"NT$ "+Math.round(x).toLocaleString("zh-TW");
function fac(rate,y){const r=rate/100/12,n=Math.round(y*12);const g=Math.pow(1+r,n);const A=r===0?n:(g-1)/r;return{r,n,g,A}}
const FV=(pv,pmt,rate,y)=>{const f=fac(rate,y);return pv*f.g+pmt*f.A};
const PMT=(pv,fv,rate,y)=>{const f=fac(rate,y);return f.A?(fv-pv*f.g)/f.A:0};
const PV=(fv,pmt,rate,y)=>{const f=fac(rate,y);return (fv-pmt*f.A)/f.g};

function chart(pts,target,y){
 const W=640,H=260,m={l:56,r:12,t:12,b:28};
 const mx=Math.max(target,...pts.map(p=>p.b))*1.05,X=i=>m.l+(W-m.l-m.r)*i/y,Y=val=>H-m.b-(H-m.t-m.b)*val/mx;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="資產成長圖">`;
 for(let k=0;k<=4;k++){const val=mx*k/4,yy=Y(val);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="var(--bd)"/><text x="${m.l-6}" y="${yy+4}" font-size="10" text-anchor="end" fill="var(--mut)">${val>=1e6?(val/1e6).toFixed(1)+"M":Math.round(val/1e3)+"K"}</text>`}
 const step=Math.max(1,Math.ceil(y/8));
 for(let i=0;i<=y;i+=step)s+=`<text x="${X(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${i}年</text>`;
 s+=`<polyline fill="none" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="2" points="${pts.map((p,i)=>X(i)+","+Y(p.t)).join(" ")}"/>`;
 s+=`<polyline fill="none" stroke="var(--ac)" stroke-width="2" stroke-dasharray="2 3" points="${pts.map((p,i)=>X(i)+","+Y(p.c)).join(" ")}"/>`;
 s+=`<polyline fill="none" stroke="var(--line)" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+","+Y(p.b)).join(" ")}"/></svg>`;
 s+=`<div style="font-size:.8rem;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap"><span style="color:var(--line)">━ 預估資產</span><span style="color:var(--ac)">┅ 累計投入本金</span><span style="color:var(--bad)">┅ 目標（含通膨）</span></div>`;
 return s}

function goal(){
 const T=v("g_t"),y=Math.max(1,Math.round(v("g_y"))),pv=v("g_pv"),pmt=v("g_pmt"),r=v("g_r"),inf=v("g_i");
 const adj=T*Math.pow(1+inf/100,y);
 const proj=FV(pv,pmt,r,y),need=Math.max(0,PMT(pv,adj,r,y)),gap=adj-proj,pct=Math.min(100,proj/adj*100);
 const needPV=PV(adj,pmt,r,y),invested=pv+pmt*12*y;
 const pts=[];for(let i=0;i<=y;i++)pts.push({b:FV(pv,pmt,r,i),c:pv+pmt*12*i,t:adj*i/y});
 let h=`<div class="status ${gap<=0?"ok":"no"}">${gap<=0?`✔ 依目前計畫，預估可達標，超出約 ${fmt(-gap)}`:`✖ 依目前計畫尚有缺口 ${fmt(gap)}，建議每月提高至 ${fmt(need)}`}</div>
 <div class="kpis"><div class="k"><small>目標金額（含通膨）</small><b>${fmt(adj)}</b></div><div class="k"><small>預估 FV 終值</small><b>${fmt(proj)}</b></div><div class="k"><small>達標所需 PMT／月</small><b>${fmt(need)}</b></div><div class="k"><small>達標所需 PV 現值</small><b>${fmt(Math.max(0,needPV))}</b></div></div>
 <div style="font-size:.85rem">目標達成度 ${pct.toFixed(1)}%</div><div class="bar"><i style="width:${pct}%"></i></div>
 ${chart(pts,adj,y)}
 <h3>情境分析：不同報酬率</h3><div class="sc"><table><tr><th>年報酬率</th><th>預估終值</th><th>與目標差距</th><th>達標所需月投入</th></tr>`;
 [r-2,r,r+2].filter(x=>x>=0).forEach(x=>{const f=FV(pv,pmt,x,y),d=adj-f;h+=`<tr><td>${x.toFixed(1)}%${x===r?"（目前）":""}</td><td>${fmt(f)}</td><td style="color:${d<=0?"var(--good)":"var(--bad)"}">${d<=0?"+"+fmt(-d):"-"+fmt(d)}</td><td>${fmt(Math.max(0,PMT(pv,adj,x,y)))}</td></tr>`});
 h+=`</table></div><h3>不同年限所需月投入</h3><div class="sc"><table><tr><th>年限</th><th>目標（含通膨）</th><th>所需月投入</th></tr>`;
 [y-5,y,y+5].filter(x=>x>=1).forEach(x=>{const a=T*Math.pow(1+inf/100,x);h+=`<tr><td>${x} 年</td><td>${fmt(a)}</td><td>${fmt(Math.max(0,PMT(pv,a,r,x)))}</td></tr>`});
 h+=`</table></div><p class="note">累計投入本金 ${fmt(invested)}，其中投資收益約 ${fmt(proj-invested)}。</p>`;
 $("out1").innerHTML=h}

function calc(){
 const s=$("c_s").value,r=v("c_r"),y=v("c_y");
 $("c_pv_w").classList.toggle("hide",s==="PV");$("c_pmt_w").classList.toggle("hide",s==="PMT");$("c_fv_w").classList.toggle("hide",s==="FV");
 let val,label,expl;const f=fac(r,y);
 if(s==="FV"){val=FV(v("c_pv"),v("c_pmt"),r,y);label="終值 FV";expl="FV = PV×(1+i)ⁿ + PMT×[((1+i)ⁿ−1)/i]"}
 if(s==="PMT"){val=PMT(v("c_pv"),v("c_fv"),r,y);label="每月投入 PMT";expl="PMT = (FV − PV×(1+i)ⁿ) ÷ [((1+i)ⁿ−1)/i]"}
 if(s==="PV"){val=PV(v("c_fv"),v("c_pmt"),r,y);label="現值 PV";expl="PV = (FV − PMT×[((1+i)ⁿ−1)/i]) ÷ (1+i)ⁿ"}
 $("out2").innerHTML=`<div class="k" style="padding:18px"><small>${label}</small><b style="font-size:1.9rem">${fmt(Math.max(0,val))}</b></div>
 <h3>使用公式</h3><p>${expl}</p><p class="note">i = 年報酬率 ÷ 12 = ${(f.r*100).toFixed(4)}%（月利率）；n = ${f.n} 期（月）。</p>
 ${val<0&&s!=="FV"?'<p class="note">結果為負：代表現有資金與投入已足以達成目標。</p>':""}`}

const presets={retire:[10000000,25,300000,20000,5],house:[3000000,8,200000,25000,3],edu:[2000000,12,100000,10000,4],car:[1000000,5,100000,12000,2]};
document.querySelectorAll(".presets button").forEach(b=>b.onclick=()=>{const p=presets[b.dataset.p];["g_t","g_y","g_pv","g_pmt","g_r"].forEach((id,i)=>$(id).value=p[i]);goal()});
document.querySelectorAll("#p1 input").forEach(e=>e.oninput=goal);
document.querySelectorAll("#p2 input,#p2 select").forEach(e=>e.oninput=calc);
$("t1").onclick=()=>{$("p1").classList.remove("hide");$("p2").classList.add("hide");$("t1").classList.add("on");$("t2").classList.remove("on")};
$("t2").onclick=()=>{$("p2").classList.remove("hide");$("p1").classList.add("hide");$("t2").classList.add("on");$("t1").classList.remove("on")};
goal();calc();
</script>
</body>
</html>
